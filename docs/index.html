<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>typing.lofi</title>
    <meta name="description" content="A minimal typing test." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400&family=Space+Grotesk:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="bar">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div class="brandText">
            <div class="brandName">typing.lofi</div>
          </div>
        </div>
      </header>

      <section class="surface">
        <div class="controls">
          <div class="seg" role="tablist" aria-label="Mode">
            <button id="modePassage" class="segBtn isActive" type="button" role="tab" aria-selected="true">
              <svg class="modeIcon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M6 12h12"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.2"
                />
              </svg>
              <span class="srOnly">passage</span>
            </button>
            <button id="modeWords" class="segBtn" type="button" role="tab" aria-selected="false">
              <svg class="modeIcon" viewBox="0 0 24 24" aria-hidden="true">
                <g fill="currentColor">
                  <circle cx="7" cy="12" r="1.1" />
                  <circle cx="12" cy="12" r="1.1" />
                  <circle cx="17" cy="12" r="1.1" />
                </g>
              </svg>
              <span class="srOnly">words</span>
            </button>
          </div>

          <button id="themeToggle" class="themeToggle" type="button" role="switch" aria-checked="false" aria-label="Toggle dark mode">
            <svg class="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3.6" fill="currentColor" />
              <g
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                fill="none"
              >
                <line x1="12" y1="2.6" x2="12" y2="5.2" />
                <line x1="12" y1="18.8" x2="12" y2="21.4" />
                <line x1="2.6" y1="12" x2="5.2" y2="12" />
                <line x1="18.8" y1="12" x2="21.4" y2="12" />
                <line x1="5.45" y1="5.45" x2="7.3" y2="7.3" />
                <line x1="16.7" y1="16.7" x2="18.55" y2="18.55" />
                <line x1="18.55" y1="5.45" x2="16.7" y2="7.3" />
                <line x1="5.45" y1="18.55" x2="7.3" y2="16.7" />
              </g>
            </svg>
            <span class="themeTrack" aria-hidden="true">
              <span class="themeThumb"></span>
            </span>
            <svg class="themeIcon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M21 14.2A8.3 8.3 0 0 1 9.8 3a7.8 7.8 0 1 0 11.2 11.2Z"
              />
            </svg>
          </button>

          <canvas id="visualizer" class="visualizer" aria-hidden="true"></canvas>

          <div class="bgm">
            <div
              id="bgmKnob"
              class="bgmKnob"
              role="slider"
              tabindex="0"
              aria-label="BGM volume"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="40"
            >
              <div class="bgmDial">
                <span class="bgmIndicator" aria-hidden="true"></span>
              </div>
            </div>
            <div class="bgmLabel" aria-hidden="true">
              <svg class="bgmNote" viewBox="0 0 16 16" aria-hidden="true">
                <path
                  d="M4.6 3.2 L11.8 3.2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
                <path
                  d="M4.6 3.4 V12.6 M11.8 3.4 V12.6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="0.85"
                  stroke-linecap="round"
                />
                <ellipse cx="3.2" cy="12.8" rx="1.6" ry="1.15" fill="currentColor" />
                <ellipse cx="10.4" cy="12.8" rx="1.6" ry="1.15" fill="currentColor" />
              </svg>
            </div>
          </div>

          <div class="led" aria-label="Typing stats">
            <div class="ledItem ledItemWpm">
              <div class="ledLabel">wpm</div>
              <div class="ledValue" id="wpm">—</div>
            </div>
            <div class="ledSep" aria-hidden="true"></div>
            <div class="ledItem ledItemTime">
              <div class="ledLabel">time</div>
              <div class="ledValue" id="time">0:00.00</div>
            </div>
            <div class="ledSep" aria-hidden="true"></div>
            <div class="ledItem">
              <div class="ledLabel">acc</div>
              <div class="ledValue"><span id="acc">—</span><span class="unit">%</span></div>
            </div>
          </div>
        </div>

        <div
          id="words"
          class="words"
          tabindex="0"
          role="textbox"
          aria-multiline="false"
          aria-label="Text to type"
          aria-live="polite"
        ></div>

      </section>

      <footer class="footer">
        <span class="footItem">no accounts</span>
        <span class="sep" aria-hidden="true">/</span>
        <span class="footItem">no tracking</span>
        <span class="sep" aria-hidden="true">/</span>
        <span class="footItem">just vibe</span>
      </footer>
    </main>

    <div
      id="pauseModal"
      class="pmRoot"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="pmTitle"
      data-open="false"
    >
      <div class="pmBackdrop" aria-hidden="true"></div>
      <div class="pmCard" role="document" tabindex="-1">
        <div class="pmGrid" aria-hidden="true"></div>

        <header class="pmHeader">
          <span class="pmStatus" aria-hidden="true">
            <span class="pmLed"></span>
            <span class="pmStatusLabel">paused</span>
          </span>
          <span class="pmDots" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </span>
        </header>

        <div class="pmBody">
          <button id="pmResume" class="pmKey pmKeyEsc" type="button" data-action="resume">
            <span class="pmKeyTop">
              <span class="pmKeyLabel">esc</span>
            </span>
            <span class="pmKeyAction">resume</span>
          </button>

          <button id="pmRefresh" class="pmKey pmKeyEnter" type="button" data-action="restart">
            <span class="pmKeyTop">
              <svg class="pmReturnIcon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M19 6 V12 H8 M11 9 L8 12 L11 15"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <span class="pmKeyAction">restart</span>
          </button>
        </div>

        <footer class="pmFooter">
          <span class="pmMatrix" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </span>
          <span class="pmFooterText">
            <span id="pmTitle" class="pmFooterTitle">session paused</span>
            <span class="pmCursor" aria-hidden="true">_</span>
          </span>
          <span class="pmMatrix" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
          </span>
        </footer>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
